[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aifactory"
version = "2.0.0"
description = "AI Factory: plan, build, independently verify, merge and release software changes."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "sqlalchemy>=2.1",
  "httpx>=0.28",
  "pydantic>=2.14",
  "cryptography>=50",
  "pyjwt[crypto]>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "pytest-asyncio>=1.4", "playwright>=1.64"]

[project.scripts]
aifactory = "aifactory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aifactory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
