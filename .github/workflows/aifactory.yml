name: AI Factory v2

on:
  pull_request:
    paths: ["aifactory/**", ".github/workflows/aifactory.yml"]
  push:
    branches: [main, factory-v2]
    paths: ["aifactory/**", ".github/workflows/aifactory.yml"]

permissions:
  contents: read

concurrency:
  group: aifactory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite runs as three shards on three runners (tests/conftest.py picks each test's shard from a hash of its
  # name). One runner took 11 minutes here and 12 to 14 for Postgres; every revision of every pull request waited
  # for that. The web build runs once, in the first shard.
  test:
    name: test-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: aifactory
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --quiet uv
          uv venv .venv
          uv pip install --python .venv/bin/python --no-deps --require-hashes --only-binary=:all: -r anton-requirements.txt
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation "anton-agent @ git+https://github.com/mindsdb/anton@537cc1fb11849e9d152870738af22ca55c1d59d8"
          uv pip install --python .venv/bin/python -e '.[dev]'
          npm install -g @openai/codex@0.167.0 --no-audit --no-fund
          # Chromium for the browser tests. apt is used only when the browser cannot start with the libraries the
          # runner image already has, so an outage of Ubuntu's package servers does not fail every build
          # (11 Nov 2026: 'Temporary failure resolving archive.ubuntu.com' on the runners for over 20 minutes).
          .venv/bin/python -m playwright install chromium
          .venv/bin/python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); p.chromium.launch().close(); p.stop()" \
            || { echo "Chromium did not start; installing its system libraries with apt"; .venv/bin/python -m playwright install-deps chromium; }
      - name: Web type-check and build
        if: matrix.shard == 1
        run: cd web && npm ci --no-audit --no-fund && npx tsc --noEmit && npm test && npx vite build
      - name: Tests (pipeline end-to-end, gateway, Native/Anton/Codex harnesses)
        env:
          AIFACTORY_TEST_SHARD: ${{ matrix.shard }}/3
        run: .venv/bin/python -m pytest -q

  postgres:
    name: postgres-${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Unsharded, the Postgres suite took 11 to 14 min; a 15 min limit cancelled PRs (#302, #321). Each shard has
    # its own runner and its own Postgres service, so the shards never share a database.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: aifactory
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory_test
        ports: ["5432:5432"]
        # A throwaway database: keep its data in memory, so commits and schema resets never wait on the disk.
        options: >-
          --health-cmd "pg_isready -U factory" --health-interval 5s --health-timeout 5s --health-retries 10
          --tmpfs /var/lib/postgresql/data
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --quiet uv
          uv venv .venv
          uv pip install --python .venv/bin/python -e '.[dev,postgres]'
          # Chromium for the browser tests. apt is used only when the browser cannot start with the libraries the
          # runner image already has, so an outage of Ubuntu's package servers does not fail every build
          # (11 Nov 2026: 'Temporary failure resolving archive.ubuntu.com' on the runners for over 20 minutes).
          .venv/bin/python -m playwright install chromium
          .venv/bin/python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); p.chromium.launch().close(); p.stop()" \
            || { echo "Chromium did not start; installing its system libraries with apt"; .venv/bin/python -m playwright install-deps chromium; }
      - name: Tests against Postgres
        env:
          AIFACTORY_TEST_DATABASE_URL: postgresql://factory:factory@127.0.0.1:5432/factory_test
          AIFACTORY_TEST_SHARD: ${{ matrix.shard }}/3
        run: .venv/bin/python -m pytest -q -p no:warnings --durations=15 --ignore=tests/test_codex_harness.py --ignore=tests/test_anton_harness.py
