name: Validate Factory Contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix src/auto_mindsdb_factory/codex_bridge --ignore-scripts --no-audit --no-fund
      - name: Check the pinned official CLI without authentication
        run: |
          probe_root=$(mktemp -d)
          trap 'rm -rf "$probe_root"' EXIT
          env -i HOME="$probe_root" PATH="$PATH" src/auto_mindsdb_factory/codex_bridge/node_modules/.bin/codex --version | tee "$probe_root/version"
          test "$(cat "$probe_root/version")" = 'codex-cli 0.167.0'
      - uses: ./.github/actions/setup-ci
      - run: uv sync --locked --extra dev
      - name: Exercise the real CLI through the loopback action gate
        env:
          AI_FACTORY_CODEX_TEST_BINARY: src/auto_mindsdb_factory/codex_bridge/node_modules/.bin/codex
        run: .venv/bin/python -m pytest -q tests/test_codex_actions.py tests/test_codex_request.py tests/test_codex_stream.py tests/test_codex_transport.py tests/test_codex_process.py

  anton:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      - run: uv sync --locked --extra dev
      - run: .venv/bin/python scripts/install_anton.py .venv/bin/python
      - run: .venv/bin/python -m pytest -q tests/test_anton_session.py tests/test_anton_inference.py tests/test_anton_runtime.py tests/test_anton_transport.py tests/test_product_execution.py tests/test_codex_inference_transport.py tests/test_product_inference_auth.py tests/test_product_inference_runtime.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix src/auto_mindsdb_factory/codex_bridge --ignore-scripts --no-audit --no-fund
      - name: Exercise the combined pinned CLI and client through the scoped proxy
        env:
          AI_FACTORY_CODEX_TEST_BINARY: src/auto_mindsdb_factory/codex_bridge/node_modules/.bin/codex
        run: .venv/bin/python -m pytest -q tests/test_codex_proxy_transport.py tests/test_codex_rpc.py tests/test_codex_session.py tests/test_codex_execution.py tests/test_codex_selection.py

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: ./.github/actions/setup-ci

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Railway transport
        run: |
          npm ci --prefix src/auto_mindsdb_factory/railway_bridge --ignore-scripts --no-audit --no-fund
          # The v1 transport suite is frozen and has one timing-sensitive test ("partial progress precedes a real
          # stalled SDK handshake timeout") that fails intermittently on shared runners. Retry the suite once, and
          # say so, rather than failing unrelated changes; a real regression fails both runs.
          node --test src/auto_mindsdb_factory/railway_bridge/client.test.mjs || {
            echo "::warning::Railway transport suite failed once; retrying (known timing-sensitive v1 test)"
            node --test src/auto_mindsdb_factory/railway_bridge/client.test.mjs
          }

      - name: Validate contracts
        run: uv run --locked python scripts/validate_contracts.py

      - name: Run tests
        # The complete suite exceeds five minutes on slower hosted runners.
        run: timeout 420 uv run --locked pytest -q

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_FACTORY_TEST_IMAGE: node@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci
      - run: docker pull "$AI_FACTORY_TEST_IMAGE"
      - run: uv run --locked --extra dev pytest -q tests/test_docker_runner.py tests/test_product_delivery.py
